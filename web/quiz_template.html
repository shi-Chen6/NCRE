<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全国计算机等级考试选择题高分刷题</title>
<link rel="icon" type="image/jpeg" href="__AUTHOR_IMG__">
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1f2d3d; --sub:#6b7a8d;
  --brand:#2f5d9e; --brand-soft:#eaf1fb; --brand-line:#c8dbf5;
  --ok:#1c8a4d; --ok-soft:#e9f7ee; --ok-line:#a9dcc0;
  --bad:#c0392b; --bad-soft:#fdecea; --bad-line:#f0b8b1;
  --gold:#b8912f; --gold-soft:#fdf6e3;
  --line:#e3e8ef; --radius:14px;
  --shadow:0 2px 10px rgba(31,45,61,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"微软雅黑","Microsoft YaHei",system-ui,-apple-system,"PingFang SC",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 60px;}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.94);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
}
.topbar .inner{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{font-size:16px;font-weight:700;color:var(--brand);letter-spacing:.3px;white-space:nowrap;}
.brand small{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px;}
.spacer{flex:1;}
.meta{font-size:13px;color:var(--sub);white-space:nowrap;}
.meta b{color:var(--ink);}

/* ---------- 按钮 ---------- */
button{
  font-family:inherit; font-size:14px; cursor:pointer; border-radius:10px;
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:9px 16px; transition:.15s; line-height:1.4;
}
button:hover{border-color:var(--brand-line); background:var(--brand-soft);}
button:disabled{opacity:.45; cursor:not-allowed; background:#fff;}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
button.primary:hover{background:#27508a;border-color:#27508a;}
button.ghost{background:transparent;border-color:transparent;color:var(--sub);padding:8px 10px;}
button.ghost:hover{background:#eef2f8;color:var(--ink);}
button.sm{padding:6px 12px;font-size:13px;}
.btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* ---------- 首页 ---------- */
.hero{padding:26px 0 10px;}
.hero h1{margin:0 0 6px;font-size:24px;letter-spacing:.5px;}
.hero p{margin:0;color:var(--sub);font-size:14px;}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 20px;}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--sub);box-shadow:var(--shadow);}
.chip b{color:var(--brand);}
.chipbtn{
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  font-size:13px;line-height:1.4;color:var(--brand);font-weight:600;box-shadow:var(--shadow);
}
.chipbtn:hover{background:var(--brand-soft);border-color:var(--brand-line);}

.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
.setcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 14px 12px; text-align:left; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.setcard:hover{transform:translateY(-2px);border-color:var(--brand-line);}
.setcard .no{font-size:17px;font-weight:700;color:var(--brand);}
.setcard .st{font-size:12px;color:var(--sub);margin-top:4px;}
.setcard .score{font-size:12px;color:var(--ok);margin-top:2px;font-weight:600;}
.setcard .go{margin-top:10px;display:inline-block;font-size:12px;color:var(--sub);}
.setcard.is-done{background:linear-gradient(180deg,#fff 0%,#f3fbf6 100%);border-color:var(--ok-line);}
.setcard.is-doing{border-color:var(--gold);background:linear-gradient(180deg,#fff 0%,#fffdf5 100%);}
.setcard .tick{position:absolute;top:10px;right:12px;font-size:15px;}
.setcard .dots{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap;}
.setcard .dots i{width:6px;height:6px;border-radius:50%;background:#dfe5ee;display:block;}
.setcard .dots i.ok{background:var(--ok);}
.setcard .dots i.bad{background:var(--bad);}
/* 套卡底部「直刷 20 题」入口：独立于闯关，点了直接开做 */
.setcard .drillbtn{
  display:block;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.2px;
}
.setcard .drillbtn:hover{color:#1f4a86;}
.setcard .drillscore{color:var(--brand);}

/* ---------- 知识点章节：首页入口条 ---------- */
.chbanner{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:linear-gradient(120deg,#fff 0%,#f2f7ff 62%,#eef4fd 100%);
  border:1px solid var(--brand-line);border-radius:var(--radius);
  padding:14px 18px;margin:0 0 20px;box-shadow:var(--shadow);
}
.chbanner:hover{border-color:var(--brand);background:linear-gradient(120deg,#fff 0%,#e9f1fd 62%,#e4eefc 100%);}
.chbanner .cbi{
  flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--brand);color:#fff;font-size:19px;font-weight:800;letter-spacing:.5px;
}
.chbanner .cbt{flex:1;min-width:0;display:block;}
.chbanner .cbt b{display:block;font-size:15.5px;color:var(--brand);letter-spacing:.3px;}
.chbanner .cbt span{display:block;font-size:12.5px;color:var(--sub);margin-top:1px;}
.chbanner .cbgo{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--brand);white-space:nowrap;}

/* ---------- 知识点章节：章节列表 ---------- */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.chcard{
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);transition:.15s;position:relative;
}
.chcard:hover{transform:translateY(-2px);border-color:var(--brand-line);}
.chcard.is-done{background:linear-gradient(180deg,#fff 0%,#f3fbf6 100%);border-color:var(--ok-line);}
.chcard .cno{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);
  font-size:14px;font-weight:800;letter-spacing:.5px;
}
.chcard.is-done .cno{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line);}
.chcard .cbody{flex:1;min-width:0;}
.chcard .cname{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.4;}
.chcard .cdesc{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.chcard .cmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--sub);}
.chcard .cmeta em{font-style:normal;background:#f2f5f9;border-radius:6px;padding:1px 7px;}
.chcard .cmeta em.best{background:var(--ok-soft);color:var(--ok);font-weight:700;}
.chcard .ctick{position:absolute;top:10px;right:12px;font-size:14px;color:var(--ok);}

/* 章节刷题：题卡左上角的来源角标（第几套第几题） */
.qsrc{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;color:#8a6d1f;letter-spacing:.2px;
  background:var(--gold-soft);border:1px solid #eadfb8;border-radius:8px;padding:3px 9px;
  white-space:nowrap;
}
.chhead{margin:16px 0 0;}
.chhead h2{margin:0 0 4px;font-size:20px;color:var(--ink);letter-spacing:.3px;}
.chhead p{margin:0;color:var(--sub);font-size:13px;}

/* ---------- 进度 ---------- */
.progwrap{margin:14px 0 18px;}
.progline{height:8px;background:#e6ebf3;border-radius:99px;overflow:hidden;}
.progline > i{display:block;height:100%;background:linear-gradient(90deg,#4a7fc1,#2f5d9e);border-radius:99px;transition:width .28s;}
.progtxt{font-size:12px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between;gap:10px;}

/* ---------- 题目卡 ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-top:16px;}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);white-space:nowrap;}
.tag.gold{background:var(--gold-soft);color:var(--gold);border-color:#eadfb8;}
.tag.gray{background:#f1f4f8;color:var(--sub);border-color:var(--line);}
.qnum{font-size:15px;font-weight:700;color:var(--brand);}
.stem{font-size:clamp(16px,2.1vw,19px);font-weight:600;margin:0 0 14px;line-height:1.6;}

.opts{display:flex;flex-direction:column;gap:9px;}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;
  font-size:clamp(15px,1.9vw,17px);color:var(--ink);cursor:pointer;transition:.13s;min-height:48px;
}
.opt:hover:not(.locked){border-color:var(--brand-line);background:var(--brand-soft);}
.opt .k{font-weight:700;color:var(--brand);min-width:20px;}
.opt.locked{cursor:default;}
.opt.correct{background:var(--ok-soft);border-color:var(--ok-line);}
.opt.correct .k{color:var(--ok);}
.opt.correct::after{content:"✓ 正确";margin-left:auto;color:var(--ok);font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px;}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad-line);}
.opt.wrong .k{color:var(--bad);}
.opt.wrong::after{content:"✕ 你的选择";margin-left:auto;color:var(--bad);font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px;}
.opt.dim{opacity:.62;}

/* ---------- 解析 ---------- */
.exp{margin-top:14px;border-left:4px solid var(--brand);background:#f8fafd;border-radius:0 10px 10px 0;padding:12px 16px;}
.exp .r1{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.exp .r1 .lab{font-size:12px;color:#fff;background:var(--brand);border-radius:6px;padding:1px 8px;white-space:nowrap;}
.exp .ans{font-size:19px;font-weight:800;color:var(--bad);letter-spacing:1px;}
.exp .ans.right{color:var(--ok);}
.exp .txt{font-size:14.5px;color:#39485c;line-height:1.8;}
.hl-ans{color:var(--bad);font-weight:700;}
.hl-opt{color:var(--brand);font-weight:700;}
.hl-warn{color:#96a0ae;font-weight:600;border-bottom:1px dashed #c7cfda;}

/* 预览模式 */
.pvitem{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:#fff;
  box-shadow:var(--shadow);transition:box-shadow .18s,border-color .18s;}
.pvitem:hover{border-color:var(--brand-line);box-shadow:0 4px 16px rgba(31,45,61,.09);}
.pvitem .st{font-size:15.5px;font-weight:600;margin:0 0 10px;line-height:1.6;}
.qbadge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-right:8px;
  border-radius:7px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);
  font-size:13px;font-weight:700;line-height:1;vertical-align:1px;}
.pvitem .opts{margin-bottom:2px;}
.pvopt{font-size:14.5px;padding:6px 10px;color:var(--sub);border-radius:8px;transition:background .15s;}
.pvopt:hover{background:var(--bg);}
.pvopt.on{color:var(--ok);font-weight:700;background:var(--ok-soft);border:1px solid var(--ok-line);}
.pvopt .k{display:inline-block;min-width:22px;font-weight:700;}

/* ---------- 证书 ---------- */
.certbox{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.certbox .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.certbox input[type=text]{
  font-family:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);
  border-radius:10px;width:220px;outline:none;
}
.certbox input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{border:0;border-radius:0;padding:9px 16px;background:#fff;font-size:13px;}
.seg button.on{background:var(--brand);color:#fff;font-weight:600;}
#certCanvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;display:block;margin:0 auto;}

/* ---------- 完成页 ---------- */
.done-hero{text-align:center;padding:20px 0 6px;}
.done-hero .big{font-size:46px;line-height:1;margin-bottom:10px;}
.done-hero h2{margin:0 0 6px;font-size:22px;color:var(--ok);}
.done-hero p{margin:0;color:var(--sub);font-size:14px;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0;}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow);}
.stat .v{font-size:23px;font-weight:800;color:var(--brand);}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px;}
.stat.ok .v{color:var(--ok);}
.stat.bad .v{color:var(--bad);}

.review{margin-top:8px;}
.review h3{font-size:16px;margin:18px 0 10px;color:var(--ink);}
.rvitem{background:#fff;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:0 10px 10px 0;padding:12px 15px;margin-bottom:10px;}
.rvitem b{color:var(--brand);}

.note{font-size:13px;color:var(--sub);margin-top:10px;}
.hidden{display:none !important;}

/* ---------- 解析重点：多档视觉层次 ---------- */
.hl-ans{color:#c0392b;font-weight:700;background:linear-gradient(transparent 60%,#ffe0dc 60%);padding:0 1px;border-radius:3px;}
.hl-opt{color:#2f5d9e;font-weight:700;letter-spacing:0;}
.hl-term{color:#0f7b77;font-weight:700;font-family:"Consolas","Courier New",monospace;font-size:.96em;letter-spacing:0;}
.hl-warn{color:#93a0af;font-weight:600;border-bottom:1px dashed #c7cfda;}
.hl-masked{color:#8b95a3;font-weight:700;background:none;letter-spacing:1px;}

.exp.easy{border-left-color:#d9b25a;background:#fffcf3;margin-top:10px;}
.exp .lab{display:inline-block;font-size:12px;color:#fff;background:var(--brand);border-radius:6px;padding:1px 9px;margin-bottom:7px;}
.exp .lab-easy{display:inline-block;font-size:12px;font-weight:700;color:#8a6d1f;background:#fbf1d8;border:1px solid #ecdcae;border-radius:6px;padding:1px 9px;margin-bottom:7px;}
.exp .picknote{color:var(--sub);font-size:13px;}
/* ---------- 题目 + 解析两栏：左列文字、右列配图（方案 B） ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;}
.split.one{grid-template-columns:minmax(0,1fr);}
.split>.col-a{min-width:0;}
.split>.col-b{position:sticky;top:74px;}
.split>.col-b .expimg{margin-top:0;}
/* 单列排布（改版前原本的样子）：配图回到解析下方，不跟随滚动。
   DOM 里右栏本就排在文字之后，所以这里只是把网格收成一列，不需要改渲染逻辑。 */
body.lay-single .split{grid-template-columns:minmax(0,1fr);gap:0;}
body.lay-single .split>.col-b{position:static;}
body.lay-single .split>.col-b .expimg{margin-top:12px;}
/* 单列时正文一行会到 65 字上下，偏长；容器收回 1000px 更接近改版前观感 */
body.lay-single .wrap,
body.lay-single .topbar .inner{max-width:1000px;}
/* 窄屏（笔记本小窗 / 平板 / 手机）一律单列 —— 不受排版开关影响 */
@media (max-width:1080px){
  .split{grid-template-columns:minmax(0,1fr);gap:0;}
  .split>.col-b{position:static;}
  .split>.col-b .expimg{margin-top:12px;}
}
/* ---------- 排版切换（桌面端） ---------- */
.layseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;}
.layseg button{border:0;border-radius:0;padding:5px 12px;font-size:13px;background:#fff;color:var(--sub);}
.layseg button+button{border-left:1px solid var(--line);}
.layseg button:hover{background:#eef2f8;color:var(--ink);}
.layseg button.on{background:var(--brand-soft);color:var(--brand);font-weight:700;}
.layseg button.on:hover{background:var(--brand-soft);color:var(--brand);}
/* 窄屏只能单列，留着开关反而让人以为点了没生效 */
@media (max-width:1080px){ .layseg{display:none !important;} }
/* 配图：插在解析右侧（桌面）/ 解析下方（窄屏）。max-width 收口，避免单列时图占满整屏 */
.expimg{margin:12px auto 0;max-width:660px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;text-align:center;box-shadow:var(--shadow);}
.expimg img{max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto;cursor:zoom-in;}
.expimg .cap{font-size:12.5px;color:var(--sub);margin-top:7px;}
@media print{.expimg{break-inside:avoid;box-shadow:none;}}
/* 配图点击放大 */
.imgbox{position:fixed;inset:0;z-index:120;background:rgba(15,20,28,.9);display:none;
  align-items:center;justify-content:center;padding:28px;cursor:zoom-out;}
.imgbox.on{display:flex;}
.imgbox img{max-width:100%;max-height:calc(100vh - 96px);border-radius:10px;background:#fff;}
.imgbox .hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#dbe2ec;font-size:13px;}
/* 逐项讲解：每个选项单独一行，带悬挂缩进 */
.optline{display:block;padding-left:1.7em;text-indent:-1.7em;margin:4px 0;}
.optline:first-child{margin-top:0;}
.optline + .optline{margin-top:5px;}
.exp.hint-empty{border-left-color:#c8d2e0;background:#f7f9fc;}
.maskbar{font-size:13.5px;color:#8a6d1f;background:#fffaf0;border:1px dashed #e6d6a8;border-radius:10px;padding:9px 13px;margin-bottom:12px;}

/* ---------- 关卡制 ---------- */
.lvtrack{display:flex;align-items:flex-start;margin:4px 0 16px;overflow-x:auto;padding:2px 0 6px;}
.lvnode{position:relative;flex:1 0 auto;min-width:92px;text-align:center;padding:0 4px;cursor:pointer;}
.lvnode::before,.lvnode::after{content:"";position:absolute;top:15px;height:2px;background:var(--line);z-index:0;}
.lvnode::before{left:0;right:50%;}
.lvnode::after{left:50%;right:0;}
.lvnode:first-child::before,.lvnode:last-child::after{display:none;}
.lvnode.done::before,.lvnode.done::after{background:var(--brand);}
.lvnode .lvd{position:relative;z-index:1;width:32px;height:32px;margin:0 auto;border-radius:50%;
  display:grid;place-items:center;font-size:14px;font-weight:700;
  background:#fff;border:2px solid var(--line);color:var(--sub);transition:.16s;}
.lvnode.done .lvd{background:var(--brand);border-color:var(--brand);color:#fff;}
.lvnode.now .lvd{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}
.lvnode.locked .lvd{background:var(--bg);border-color:var(--line);color:#b3bcc9;}
.lvnode.locked{cursor:not-allowed;}
.lvnode:hover:not(.locked) .lvd{transform:translateY(-1px);}
.lvnode.boss .lvd{border-radius:10px;}
.lvnode.boss.done .lvd{background:var(--gold);border-color:var(--gold);}
.lvnode .nm{font-size:12.5px;margin-top:6px;color:var(--sub);white-space:nowrap;}
.lvnode.now .nm{color:var(--brand);font-weight:700;}
.lvnode .sk{font-size:13px;line-height:16px;height:16px;color:var(--gold);letter-spacing:1px;}

.lvcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px 28px;margin-top:16px;text-align:center;}
.lvcard .kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2px;
  color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-line);
  border-radius:999px;padding:2px 12px;}
.lvcard h2{margin:12px 0 8px;font-size:23px;color:var(--ink);}
.lvcard .lead{margin:0;color:var(--sub);font-size:14px;}

<script>
(function(){
"use strict";

/* ==================== 数据 ==================== */
var DATA = JSON.parse(document.getElementById("quiz-data").textContent);
var SETS = DATA.sets;
var GROUP_SIZE = 5;
var LS_KEY = "quiz_progress_v2";

/* 知识点章节：只存「章 → [(套号, 题号)]」引用，题目对象在这里现挂，
   避免题干、解析、base64 配图在页面里存两份。 */
var CH = DATA.chapters || [];
var ITEM_BY_KEY = {};
SETS.forEach(function(s){
  s.items.forEach(function(q){ ITEM_BY_KEY[s.set + "-" + q.no] = q; });
});
CH.forEach(function(c){
  var arr = [];
  (c.items || []).forEach(function(p){
    var q = ITEM_BY_KEY[p[0] + "-" + p[1]];
    if (q) arr.push(q);            // 按「套号升序、套内题号升序」排好，同一题在多套出现都保留
  });
  c.objs = arr;
  c.total = arr.length;
});

/* ==================== 进度存储 ==================== */
function loadProgress(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }catch(e){}
}
var progress = loadProgress();

/* ==================== 排版偏好（单列 / 两栏） ====================
   两栏靠 CSS Grid 实现，配图那一栏在 DOM 里本就排在文字之后，
   所以「单列」只是把网格收成一列 —— 渲染逻辑完全不用动。 */
var LS_LAYOUT = "quiz_layout_v1";
var LS_TIP = "quiz_layout_tip_v1";     // 首次「排版引导」是否已经展示过
var LAYOUTS = ["single", "split"];
function loadLayout(){
  try{
    var v = localStorage.getItem(LS_LAYOUT);
    return (v === "single" || v === "split") ? v : "single";   // 默认单列
  }catch(e){ return "single"; }
}
function saveLayout(){
  try{ localStorage.setItem(LS_LAYOUT, S.layout); }catch(e){}
}
/* 只改 body 上一个类 + 按钮高亮，不重渲染 ——
   页面已 46 MB，整套重渲染会有可感知的停顿。 */
function applyLayout(){
  var seg = document.getElementById("laySeg");
  if (seg && seg.children){
    for (var i = 0; i < seg.children.length; i++){
      var b = seg.children[i];
      if (b && b.classList && b.classList.toggle){
        b.classList.toggle("on", b.getAttribute("data-mode") === S.layout);
      }
    }
  }
  var bd = document.body;
  if (bd && bd.classList){
    bd.classList.remove("lay-single");
    if (S.layout === "single") bd.classList.add("lay-single");
  }
}
function setLayout(m){
  if (LAYOUTS.indexOf(m) < 0 || m === S.layout) return false;
  S.layout = m;
  saveLayout();
  applyLayout();
  return true;
}

/* ---------- 首次打开的排版引导 ----------
   只在「没看过引导」且「没主动选过排版」时出现一次；
   窄屏（≤1080px）开关本身被 CSS 隐藏，这时就不弹。 */
function layoutTipDone(){
  try{ return localStorage.getItem(LS_TIP) === "1"; }catch(e){ return true; }
}
function markLayoutTipDone(){
  try{ localStorage.setItem(LS_TIP, "1"); }catch(e){}
}
function layoutTipOn(){
  var tip = document.getElementById("layoutTip");
  return !!(tip && tip.classList && tip.classList.contains("on"));
}
/* 把气泡贴到「单列 / 两栏」开关正下方，箭头对准开关中心 */
function placeLayoutTip(){
  var seg = document.getElementById("laySeg");
  var tip = document.getElementById("layoutTip");
  if (!seg || !tip) return false;
  var r = seg.getBoundingClientRect();
  if (!r.width || !r.height) return false;          // 开关被隐藏（窄屏）
  tip.style.top = Math.round(r.bottom + 14) + "px";
  tip.style.right = Math.round(Math.max(16, window.innerWidth - r.right)) + "px";
  var w = tip.offsetWidth || 340;
  var centerFromRight = window.innerWidth - (r.left + r.width / 2);
  tip.style.setProperty("--arrow-right",

/* 关卡：小关数由题量算出来，后面固定跟两个特殊关 —— 错题订正关、整套重刷关。
   20 题 / 每组 5 题 → 4 个小关 + 订正关 + 通关考 = 6 关。题量变了关卡数自动跟着变。 */
var LEVEL_NAMES = ["识途", "进阶", "攻坚", "冲刺", "决胜", "精进", "磨砺", "登顶", "破局", "问鼎"];

function nowMs(){ return (typeof Date !== "undefined" && Date.now) ? Date.now() : 0; }
function groupCount(){ return Math.ceil(itemArr().length / GROUP_SIZE); }
function retryLevel(){ return groupCount(); }          // 错题订正关
function fullLevel(){ return groupCount() + 1; }       // 整套重刷关
function levelCount(){ return groupCount() + 2; }
/* 每一关的性质：study（分组闯关）| retry（错题订正）| full（整套重刷） */
function levelKind(k){
  if (k < groupCount()) return "study";
  if (k === groupCount()) return "retry";
  return "full";
}
function isBossLevel(k){ return k >= groupCount(); }   // 后两关都算「决战段」，用金色样式
function levelName(k){
  var kind = levelKind(k);
  if (kind === "retry") return "错题订正";
  if (kind === "full") return "整套重刷";
  return LEVEL_NAMES[k] || ("第 " + (k + 1) + " 关");
}
function levelShort(k){
  var kind = levelKind(k);
  if (kind === "retry") return "错题订正";
  if (kind === "full") return "整套重刷";
  return "第 " + (k + 1) + " 关";
}
function levelTotal(k){
  var kind = levelKind(k);
  if (kind === "full") return itemArr().length;
  if (kind === "retry") return S.retryTotal;
  return Math.max(0, Math.min(GROUP_SIZE, itemArr().length - k * GROUP_SIZE));
}
/* 订正关的「答对数」= 一次就答对的题数（答错会退回重看解析，所以看首次命中才有区分度） */
function retryFirstTry(){
  var n = 0;
  for (var i = 0; i < S.wrong.length; i++){
    if ((S.retryTries[S.wrong[i]] || 0) === 1) n++;
  }
  return n;
}
function levelRight(k){
  var kind = levelKind(k);
  if (kind === "full") return fullRight();
  if (kind === "retry") return S.retryTotal ? retryFirstTry() : 0;
  var it = itemArr();
  var start = k * GROUP_SIZE, end = Math.min(start + GROUP_SIZE, it.length), n = 0;
  for (var i = start; i < end; i++){ if (S.results[i] === it[i].answer) n++; }
  return n;
}
function levelStars(right, total){
  if (!total) return 0;
  if (right >= total) return 3;
  var r = right / total;
  if (r >= 0.8) return 2;
  if (r >= 0.6) return 1;
  return 0;
}
/* 已解锁到第几关：取「已通关的最大关号 + 1」。
   用 max+1 而不是「第一个没通关的」，这样回头重刷前面的关卡不会把后面重新锁上。 */
function unlockedLevel(){
  var m = -1;
  for (var k = 0; k < levelCount(); k++){ if (S.doneLv[k]) m = k; }
  return Math.min(m + 1, levelCount());
}
function starsTotal(){ var n = 0; for (var k in S.stars) n += (S.stars[k] || 0); return n; }
function starsMax(){ return levelCount() * 3; }
function curLevel(){ return Math.max(0, Math.min(S.group, levelCount() - 1)); }
function fmtSecs(s){
  s = Math.max(0, Math.round(s || 0));
  var m = Math.floor(s / 60);
  return m ? (m + " 分 " + (s % 60) + " 秒") : (s + " 秒");
}
function starsHtml(n){
  var h = '<div class="starrow">';
  for (var i = 0; i < 3; i++) h += (i < n ? '<span>★</span>' : '<span class="off">★</span>');
  return h + "</div>";
}
function levelComment(n, st, kind){
  if (kind === "retry"){
    if (!st.total) return "首轮全对，没有需要订正的题。";
    if (st.right >= st.total) return "错题全部一次答对，说明是真懂了。";
    return st.right + "/" + st.total + " 题一次答对，其余靠重看解析才对 —— 这几题值得再翻一遍。";
  }
  if (kind === "full"){
    if (st.right >= st.total) return "整套重刷全对，这一套稳了。";
    return "整套重刷 " + st.right + "/" + st.total + " 题，比首轮进步就是收获。";
  }
  if (st.total && st.right >= st.total) return "全对！本关 " + st.total + " 题一题没漏，稳。";
  if (n === 2) return "只错 1 题，很接近满分了。";
  if (n === 1) return "过关，但错了 " + (st.total - st.right) + " 题，回看解析更稳。";
  return "这关错得有点多（错 " + (st.total - st.right) + " 题），建议点「重刷本关」再来一遍。";
}

    } else {
      lead = "首轮全部答对，没有需要订正的题。直接过关就是满星。";
      btn = "直接过关";
    }
  } else if (kind === "full"){
    lead = "最后一关：整套 " + itemArr().length + " 题从头再做一遍，不再预先给解析。";
  } else {
    lead = "本关 " + levelTotal(k) + " 题。先读解析再作答，答完自动结算星数。";
  }
  h += '<p class="lead">' + lead + "</p>";
  h += '<div class="facts">'
    + "<div><b>" + (kind === "retry" ? S.wrong.length : levelTotal(k)) + "</b>本关题量</div>"
    + "<div><b>" + (prev ? prev.right + "/" + prev.total : "—") + "</b>上一关成绩</div>"
    + "<div><b>" + starsTotal() + "/" + starsMax() + "</b>已得星数</div>"
    + "</div>";
  h += '<div class="btnrow">'
    + '<button class="primary" data-act="level-start">' + btn + "</button>"
    + '<button data-act="home">返回首页</button></div>';
  h += '<div class="note">共 ' + levelCount() + " 关：" + groupCount() + " 个闯关 + 错题订正关 + 整套重刷关</div>";
  return h + "</div>";
}

function levelResultHtml(){
  var k = curLevel(), kind = levelKind(k);
  var st = S.levelStat[k] || { right: levelRight(k), total: levelTotal(k), secs: 0, streak: 0 };
  var n = S.stars[k] || 0;
  var nextK = k + 1, lastLevel = (k >= levelCount() - 1);
  var h = '<div class="lvcard' + (isBossLevel(k) ? " boss" : "") + '">';
  h += '<div class="kicker">' + (kind === "study" ? "LEVEL " + (k + 1) + " 通关"
      : (kind === "retry" ? "错 题 已 清 零" : "全 套 完 成")) + "</div>";
  h += "<h2>" + (kind === "study" ? "第 " + (k + 1) + " 关 · " + levelName(k) + " 通关" : levelName(k) + " 通关") + "</h2>";
  h += starsHtml(n);
  h += '<div class="stats">'
    + "<div><b>" + st.right + "/" + st.total + "</b><span>"
    + (kind === "retry" ? "一次答对" : "正确率") + " " + pct(st.right, st.total) + "%</span></div>"
    + "<div><b>" + fmtSecs(st.secs) + "</b><span>本关用时</span></div>"
    + "<div><b>" + (st.streak || 0) + "</b><span>最长连对</span></div>"
    + "<div><b>" + starsTotal() + "/" + starsMax() + "</b><span>总星数</span></div>"
    + "</div>";
  h += '<p class="say">' + levelComment(n, st, kind) + "</p>";
  h += '<div class="btnrow">';
  h += '<button class="primary" data-act="level-next">'
    + (lastLevel ? "查看通关成绩 ›" : "进入" + levelShort(nextK) + " ›")
    + "</button>";
  h += '<button data-act="level-replay">重刷本关</button>';
  h += '<button class="hide-phone" data-act="home">返回首页</button>';
  return h + "</div></div>";
}

/* ==================== 解析渲染小件 ==================== */
function easyHtml(q){
  if (!q || !q.easy) return "";
  return '<div class="exp easy"><span class="lab-easy">💡 零基础详解</span>'
    + '<div class="txt">' + q.easy + '</div></div>';
}

/* 解析配图：存在才渲染。桌面上它落在右栏（见 splitHtml），窄屏自动回到解析下方。
   注意：错题重刷（答案遮蔽）环节不调用它 —— 图上带中文标签，等于直接把答案说出来。 */
function imgHtml(q){
  if (!q || !q.image) return "";
  return '<div class="expimg"><img src="' + q.image + '" data-act="zoomimg" data-src="' + q.image + '"'
    + ' alt="第 ' + q.no + ' 题知识点配图" />'
    + '<div class="cap">配图 · 左：生活类比 ｜ 右：技术示意</div></div>';
}

/* 方案 B：整题左右两栏 —— 左列题干/选项/解析，右列配图（桌面 sticky 常驻）。
   没有配图时不要留空栏，退化成单列。 */
function splitHtml(left, right){
  if (!right) return '<div class="split one"><div class="col-a">' + left + '</div></div>';
  return '<div class="split"><div class="col-a">' + left + '</div><div class="col-b">' + right + '</div></div>';
}

/* 错题重刷：遮蔽选项字母，保留全部文字分析 */
function maskHtml(html){
  if (!html) return "";
  return String(html)
    .replace(/class="hl-(?:ans|opt)"/g, 'class="hl-masked"')
    .replace(/(<b class="hl-masked">)([^<]*)(<\/b>)/g, function(m, a, b, c){
      return a + b.replace(/[A-D]/g, "●") + c;
    });
}

/* ==================== 渲染：通用小件 ==================== */
function dotsHtml(base, states, curItem, total){
  total = total || 20;
  var h = '<div class="dots" style="display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 2px">';
  for (var i = 0; i < total; i++){
    var st = states[i] || "";
    var color = st === "ok" ? "var(--ok)" : (st === "bad" ? "var(--bad)" : "#dfe5ee");
    var ring = (i === curItem) ? "box-shadow:0 0 0 2px var(--brand);" : "";
    h += '<i style="width:13px;height:13px;border-radius:4px;background:' + color + ';display:block;' + ring + '"></i>';
  }
  return h + "</div>";
}

function barHtml(done, total, textLeft, textRight){
  var p = pct(done, total);
  return '<div class="progwrap">'
    + '<div class="progline"><i style="width:' + p + '%"></i></div>'
    + '<div class="progtxt"><span>' + textLeft + '</span><span>' + textRight + '</span></div>'
    + '</div>';
}

/* ==================== 渲染：首页 ==================== */
function renderHome(){
  var doneCount = 0, totalQ = 0;
  SETS.forEach(function(s){ totalQ += s.items.length; });
  var h = '<div class="hero home-hero"><h1>全国计算机等级考试选择题高分刷题</h1>'
    + '<p>共 ' + SETS.length + ' 套 · ' + totalQ + ' 道单选题。三种练法：<b>闯关模式</b>按 5 题一组，先看答案与解析再作答，错题自动进入重刷，通关可领证书；<b>直刷模式</b>不分关，点开就从第 1 题连续做到第 20 题，答完一题立刻看解析；<b>知识点章节</b>把 ' + totalQ + ' 道题按考点重新编排，一个知识点一章，专攻薄弱环节。</p></div>';

  SETS.forEach(function(s){
    if (progress[s.set] && progress[s.set].done) doneCount++;
  });
  h += '<div class="summary">'
    + '<span class="chip">已完成 <b>' + doneCount + '</b> / ' + SETS.length + ' 套</span>'
    + '<span class="chip hide-phone">总题量 <b>' + totalQ + '</b> 题</span>'
    + '<span class="chip hide-phone">每组 <b>' + GROUP_SIZE + '</b> 题</span>'
    + '<button class="chipbtn hide-phone" data-act="onboard">▶ 玩法引导</button>'
    + '</div>';

  // 知识点章节入口：和 24 张套卡并列的第三条练法
  if (CH.length){
    var chTotal = 0;
    CH.forEach(function(c){ chTotal += c.total; });
    h += '<button class="chbanner" data-act="chapters">'
      + '<span class="cbi">章</span>'
      + '<span class="cbt"><b>按知识点刷题 · ' + CH.length + ' 章 ' + chTotal + ' 题</b>'
      + '<span>同一知识点的题归到同一章，题目不去重；左上角标着它来自第几套第几题</span></span>'
      + '<span class="cbgo">进入 ›</span></button>';
  }

  h += '<div class="setgrid">';
  SETS.forEach(function(s, i){
    var p = progress[s.set] || {};
    var cls = "setcard" + (p.done ? " is-done" : (p.partial ? " is-doing" : ""));
    var tick = p.done ? '<span class="tick">✓</span>' : "";
    var st = p.done ? "已完成" : (p.partial ? "进行中" : "未开始");
    var lvMax = Math.ceil(s.items.length / GROUP_SIZE) + 2;
    var got = 0, lvDone = 0;
    if (p.levels){ for (var k in p.levels){ got += (p.levels[k].stars || 0); lvDone++; } }
    var mainLine = p.done
      ? '<div class="score">首轮 ' + p.firstScore + "/" + s.items.length + ' · 重刷 ' + p.fullScore + "/" + s.items.length + '</div>'
      : '<div class="go">' + (p.partial ? "继续第 " + Math.min(lvDone + 1, lvMax) + " 关 ›" : "开始刷题 ›") + '</div>';
    var starLine = got > 0 ? '<div class="score">已得 ' + got + "/" + (lvMax * 3) + " 星</div>" : "";
    var drillLine = (p.drillBest && p.drillBest.total)
      ? '<div class="score drillscore">直刷 ' + p.drillBest.right + "/" + p.drillBest.total + '</div>' : "";
    h += '<button class="' + cls + '" data-act="open" data-set="' + i + '">' + tick
      + '<div class="no">第 ' + s.set + ' 套</div>'
      + '<div class="st">' + st + '</div>'
      + mainLine + starLine + drillLine
      + '<span class="drillbtn" data-act="drill" data-set="' + i + '">直刷 20 题 ›</span>'
      + '</button>';
  });
  h += "</div>";
  return h;
}

/* ==================== 渲染：预览（每组 5 题） ==================== */
function previewHtml(){
  var it = itemArr();
  var start = S.group * GROUP_SIZE;
  var end = Math.min(start + GROUP_SIZE, it.length);
  var h = '<div class="qcard">';
  h += '<div class="qhead"><span class="tag">第 ' + (S.group + 1) + ' / ' + Math.ceil(it.length / GROUP_SIZE) + ' 组</span>'
    + '<span class="tag gray">先看答案与解析</span></div>';
  h += '<p style="margin:0 0 14px;color:var(--sub);font-size:14px">本组共 ' + (end - start)
    + ' 题。请先通读下面的正确答案与解析，重点是<span class="hl-ans">红色结论</span>与<span class="hl-opt">蓝色选项</span>，看完后点下方按钮开始作答。</p>';

  for (var i = start; i < end; i++){
    var q = it[i];
    var left = '<p class="st"><span class="qbadge">' + (i + 1) + '</span>' + q.stem + '</p>';
    left += '<div class="opts">';
    ["A","B","C","D"].forEach(function(k){
      var on = (q.answer === k);
      left += '<div class="pvopt' + (on ? " on" : "") + '"><span class="k">' + k + '.</span>' + (q.options[k] || "") + (on ? " ←" : "") + '</div>';
    });
    left += '</div>';
    left += '<div class="exp"><div class="r1"><span class="lab">答案</span><span class="ans right">' + q.answer + '</span></div>'
      + '<div class="txt">' + q.analysis + '</div></div>';
    left += easyHtml(q);
    h += '<div class="pvitem">' + splitHtml(left, imgHtml(q)) + '</div>';
  }
  h += '<div class="btnrow" style="margin-top:6px"><button class="primary" data-act="start-answer">开始答题（本组 ' + (end - start) + ' 题）</button>'
    + '<span class="note" style="margin:0">答完本组继续下一组</span></div>';

  return h;
}

/* ==================== 渲染：单题作答 ==================== */
function quizItemHtml(itemIdx, opts){
  var q = itemArr()[itemIdx];
  var box = resBox();
  var picked = box[itemIdx] || null;
  var revealed = !!picked;
  var h = '<div class="qcard">';
  h += '<div class="qhead">';
  // 章节刷题：左上角标明这道题来自第几套第几题（同一题在多套出现就出现多次）
  if (S.stage === "chapter") h += '<span class="qsrc">第 ' + q.set + ' 套 · 第 ' + q.no + ' 题</span>';
  else h += '<span class="qnum">第 ' + (itemIdx + 1) + ' 题</span>';
  if (S.stage === "study") h += '<span class="tag">第 ' + (S.group + 1) + ' 组 · 第 ' + (S.cur + 1) + '/' + S.list.length + ' 题</span>';
  if (S.stage === "retry") h += '<span class="tag gold">错题重刷 · 第 ' + (S.cur + 1) + '/' + S.list.length + ' 题</span>';
  if (S.stage === "full") h += '<span class="tag gold">整套重刷 · 第 ' + (S.cur + 1) + '/' + S.list.length + ' 题</span>';
  if (S.stage === "drill") h += '<span class="tag gold">直刷 · 第 ' + (S.cur + 1) + '/' + S.list.length + ' 题</span>';
  if (S.stage === "chapter") h += '<span class="tag gold">本章第 ' + (S.cur + 1) + '/' + S.list.length + ' 题</span>';
  h += '<span class="spacer" style="flex:1"></span>';
  if (revealed) h += '<span class="tag ' + (picked === q.answer ? '' : 'gray') + '">' + (picked === q.answer ? '✓ 答对' : '✕ 答错') + '</span>';
  h += '</div>';

  var left = '<p class="stem">' + q.stem + '</p>';
  left += '<div class="opts">';
  ["A","B","C","D"].forEach(function(k){
    var cls = "opt";
    if (revealed){
      cls += " locked";
      if (k === q.answer) cls += " correct";
      else if (k === picked) cls += " wrong";
      else cls += " dim";
    }
    left += '<button class="' + cls + '" data-act="pick" data-key="' + k + '"' + (revealed ? ' data-locked="1"' : '') + '>'
      + '<span class="k">' + k + '</span><span>' + (q.options[k] || "") + '</span></button>';
  });
  left += '</div>';

  var right = "";
  if (revealed){
    left += '<div class="exp"><div class="r1"><span class="lab">正确答案</span><span class="ans' + (picked === q.answer ? ' right' : '') + '">' + q.answer + '</span>'
      + '<span class="picknote">' + (picked === q.answer ? '你选对了' : '你选了 ' + picked) + '</span></div>'
      + '<div class="txt">' + q.analysis + '</div></div>';
    left += easyHtml(q);
    right = imgHtml(q);          // 遮蔽环节 imgHtml 返回空串 → 自动退化成单列，不会露底
  } else {
    left += '<div class="exp hint-empty"><div class="txt">请选择一个选项，作答后立即显示对错与解析。</div></div>';
  }
  h += splitHtml(left, right);
  h += '</div>';
  return h;
}

/* ==================== 渲染：答题页 ==================== */
function renderQuiz(){
  var track = trackHtml();
  // 关卡外壳：开场卡 / Boss 中场 / 结算卡 都不走下面的答题渲染
  if (S.shell !== "play"){
    var shellBody = S.shell === "intro" ? levelIntroHtml() : levelResultHtml();
    return track + '<div>' + '<span class="tag">第 ' + setObj().set + ' 套</span>' + shellBody + '</div>';
  }
  var it = itemArr();
  var h = track;
  var head = '<span class="tag">第 ' + setObj().set + ' 套</span>';
  var doneN, totalN, leftTxt, rightTxt;

  if (S.stage === "study"){
    doneN = Object.keys(S.results).length;
    totalN = it.length;
    leftTxt = "首轮进度 " + doneN + "/" + totalN;
    rightTxt = S.mode === "preview" ? "第 " + (S.group + 1) + " 组 · 预览" : "第 " + (S.group + 1) + " 组 · 作答";
    h += head;
    h += '<div style="margin-top:12px">' + barHtml(doneN, totalN, leftTxt, rightTxt) + '</div>';
    var st = {};
    for (var i = 0; i < it.length; i++){
      if (S.results[i]) st[i] = (S.results[i] === it[i].answer ? "ok" : "bad");
    }
    h += dotsHtml(0, st, S.list[S.cur], it.length);
    h += (S.mode === "preview") ? previewHtml() : (function(){
      var html = quizItemHtml(S.list[S.cur], null);
      html += navHtml();
      return html;
    })();
  } else if (S.stage === "retry"){
    doneN = S.retryDone; totalN = S.retryTotal;
    h += head + '<span class="tag gold">错题重刷</span>';
    h += '<div style="margin-top:12px">' + barHtml(doneN, totalN, "已订正 " + doneN + "/" + totalN + " 题", "剩余错题 " + S.list.length + " 题") + '</div>';
    h += dotsHtml(0, {}, 0, totalN);
    var rq = it[S.list[S.cur]];
    h += '<div class="qcard"><p style="margin:0 0 12px;color:var(--sub);font-size:14px">'
      + '先看错题解析再作答。答对的题会移出错题本，答错的留在队列里，全部答对后进入整套重刷。</p>';
    if (S.revealRetry){
      h += '<p class="stem">' + rq.stem + '</p>';
      h += '<div class="maskbar">答案已遮蔽：解析中的选项字母一律显示为 ●，请先读懂思路、自行判断该选哪一项，再点下方按钮作答。</div>';
      h += '<div class="exp"><span class="lab">思路解析</span><div class="txt">' + maskHtml(rq.analysis) + '</div></div>';
      if (rq.easy){
        h += '<div class="exp easy"><span class="lab-easy">💡 零基础详解</span><div class="txt">' + maskHtml(rq.easy) + '</div></div>';
      }
      h += '<div class="btnrow" style="margin-top:14px"><button class="primary" data-act="retry-go">我记住了，开始作答</button></div>';
    } else {
      h += quizItemHtml(S.list[S.cur], null);
    }
    h += '</div>';
    if (!S.revealRetry) h += navHtml();
  } else if (S.stage === "full"){
    doneN = Object.keys(S.fullResults).length; totalN = it.length;
    h += head + '<span class="tag gold">整套重刷</span>';
    h += '<div style="margin-top:12px">' + barHtml(doneN, totalN, "整套重刷 " + doneN + "/" + totalN + " 题", "正确率 " + pct(fullRight(), doneN || 1) + "%") + '</div>';
    h += dotsHtml(0, S.fullResults, S.list[S.cur], totalN);
    h += quizItemHtml(S.list[S.cur], null);
    h += navHtml();
  }
  return h;
}

/* ==================== 上一题 / 下一题 ==================== */
function canPrev(){ return S.cur > 0; }
function navHtml(){
  if (S.stage === "retry"){
    var itemIdx = S.list[S.cur];
    var picked = S.retryResults[itemIdx];
    var bar = '<div class="btnrow" style="margin-top:14px">';
    if (!picked){
      bar += '<button class="primary" disabled>请先选择答案</button>';
    } else if (picked === itemArr()[itemIdx].answer){
      bar += '<button class="primary" data-act="retry-next">'
        + (S.list.length <= 1 ? "错题已清空，进入整套重刷 ›" : "下一题 ›") + '</button>';
    } else {
      bar += '<button class="primary" data-act="retry-again">再看一遍解析</button>';
    }
    return bar + '</div>';
  }
  var last = (S.cur === S.list.length - 1);
  var answered = !!resBox()[S.list[S.cur]];
  var mainLabel = "";
  if (S.stage === "study") mainLabel = last ? "本组完成，下一组 ›" : "下一题 ›";
  else if (S.stage === "full") mainLabel = last ? "提交整套重刷 ›" : "下一题 ›";
  var h = '<div class="btnrow" style="margin-top:14px">';
  h += '<button data-act="prev"' + (canPrev() ? '' : ' disabled') + '>‹ 上一题</button>';
  h += '<button class="primary" data-act="next"' + (answered ? '' : ' disabled') + '>' + mainLabel + '</button>';
  h += '<span class="note kbnote" style="margin:0">快捷键：← → 切题，1–4 选项</span>';
  h += '</div>';
  return h;
}

/* ==================== 直刷模式（不闯关，直接连做 20 题） ====================
   和闯关模式完全独立：不分组、不预览、不看星级，第 1 题直接作答，
   每题答完立刻出对错与解析，20 题做完给一份成绩单。进度只记「最好一次」。 */
function drillCount(){ return Object.keys(S.drillResults).length; }
function drillRight(){
  var it = itemArr(), n = 0;
  for (var i = 0; i < it.length; i++){ if (S.drillResults[i] === it[i].answer) n++; }
  return n;
}
function drillSecs(){
  if (!S.drillStart) return 0;
  var end = S.drillEnd || nowMs();
  return Math.max(1, Math.round((end - S.drillStart) / 1000));
}

function openDrill(i){
  if (i < 0 || i >= SETS.length) return;
  S.setIdx = i;
  S.view = "drill";
  S.stage = "drill";
  S.shell = "play";
  S.group = 0;
  S.cur = 0;
  S.list = [];
  for (var k = 0; k < itemArr().length; k++) S.list.push(k);
  S.drillResults = {};
  S.drillStart = nowMs();
  S.drillEnd = 0;
  S.streak = 0;
  S.bestStreak = 0;
  render();
}

function drillNavHtml(){
  var last = S.cur >= S.list.length - 1;
  var answered = !!S.drillResults[S.list[S.cur]];
  var h = '<div class="btnrow" style="margin-top:14px">';
  h += '<button data-act="drill-prev"' + (S.cur > 0 ? '' : ' disabled') + '>‹ 上一题</button>';
  h += '<button class="primary" data-act="drill-next"' + (answered ? '' : ' disabled') + '>'
    + (last ? '交卷看成绩 ›' : '下一题 ›') + '</button>';
  h += '<button class="ghost hide-phone" data-act="home">退出直刷</button>';
  h += '<span class="note kbnote" style="margin:0">快捷键：← → 切题，1–4 选项</span>';
  return h + '</div>';
}

function renderDrill(){
  var it = itemArr(), done = drillCount();
  var states = {}, i;
  for (i = 0; i < it.length; i++){
    if (S.drillResults[i]) states[i] = (S.drillResults[i] === it[i].answer ? "ok" : "bad");
  }
  var h = '<div class="qhead" style="margin-bottom:0">'
    + '<span class="tag">第 ' + setObj().set + ' 套</span>'
    + '<span class="tag gold">直刷模式</span>'
    + '<span class="tag gray">不分组 · 答完一题就出解析</span></div>';
  h += '<div style="margin-top:12px">' + barHtml(done, it.length,
      "已答 " + done + "/" + it.length + " 题", "当前答对 " + drillRight() + " 题") + '</div>';
  h += dotsHtml(0, states, S.cur, it.length);

/* ==================== 知识点章节刷题 ====================

function pad2(n){ return (n < 10 ? "0" : "") + n; }
function chapterRight(){

function chapterSecs(){
  if (!S.chapterStart) return 0;

function chapterProg(id){ return (progress.chapters || {})[id] || {}; }

function chNext(){

}
function chPrev(){

  S.cur--; render();
}

/* ==================== 流程：开始 / 分组 ==================== */
/* ==================== 流程：关卡外壳 ==================== */
function openSet(i){
  S.setIdx = i;
  S.view = "quiz";
  S.stage = "study";
  S.group = 0;
  S.mode = "preview";
  S.cur = 0;
  S.results = {};
  S.wrong = [];
  S.retryQueue = [];
  S.retryDone = 0;
  S.retryTotal = 0;
  S.retryResults = {};
  S.retryTries = {};
  S.fullResults = {};
  S.revealRetry = true;
  S.name = "";
  S.certStyle = "simple";
  S.streak = 0;
  S.bestStreak = 0;
  S.stars = {};
  S.doneLv = {};
  S.levelStat = {};

  // 恢复已存档的关卡成绩（每关过关即落盘，中途退出不必从头再来）
  var saved = progress[setObj().set];
  if (saved && saved.levels){
    for (var k in saved.levels){
      var lv = saved.levels[k];
      if (!lv) continue;
      S.levelStat[k] = lv;
      S.stars[k] = lv.stars || 0;
      if (lv.done) S.doneLv[k] = true;
    }
  }
  if (saved && saved.results) S.results = saved.results;

  S.list = groupList(0);
  enterLevel(unlockedLevel());
}

function groupList(g){
  var it = itemArr(), out = [];
  var start = g * GROUP_SIZE;
  for (var i = start; i < Math.min(start + GROUP_SIZE, it.length); i++) out.push(i);
  return out;
}

function recomputeWrong(){
  var it = itemArr();
  S.wrong = [];
  for (var i = 0; i < it.length; i++){ if (S.results[i] !== it[i].answer) S.wrong.push(i); }
}

/* 进入某关的开场卡 */
function enterLevel(k){
  S.group = Math.max(0, Math.min(k, levelCount() - 1));   // 最后一关是整套重刷关，不是 groupCount
  // 订正关/通关考的开场卡要显示「先订正 N 道错题」，所以进卡前就得把错题算出来
  if (isBossLevel(S.group)) recomputeWrong();
  S.cur = 0;
  S.shell = "intro";
  S.levelStart = nowMs();
  S.streak = 0;
  S.bestStreak = 0;
  render();
}

/* 开场卡的「开始挑战」：真正把本关跑起来 */
function beginLevel(){
  var k = curLevel(), kind = levelKind(k);
  S.cur = 0;
  S.streak = 0;
  S.bestStreak = 0;
  S.levelStart = nowMs();
  if (kind === "study"){
    S.stage = "study";
    S.mode = "preview";
    S.list = groupList(k);
  } else if (kind === "retry"){
    recomputeWrong();
    if (S.wrong.length){
      startRetry();
    } else {
      // 首轮全对 → 无错可订，直接满星过关
      S.stage = "retry";
      S.list = [];
      S.retryTotal = 0;
      finishLevel();
      render();
      return;
    }
  } else {
    startFull();
  }
  S.shell = "play";
  render();
}

/* 结算卡的「进入下一关」 */
function nextLevel(){
  var k = curLevel() + 1;
  if (k >= levelCount()){ S.view = "done"; render(); return; }
  enterLevel(k);
}

/* 重刷某一关：清掉该关的作答与成绩，回到开场卡 */
function replayLevel(k){
  if (k === undefined || k === null) k = curLevel();
  var kind = levelKind(k);
  if (kind === "study"){
    var start = k * GROUP_SIZE, end = Math.min(start + GROUP_SIZE, itemArr().length);
    for (var i = start; i < end; i++) delete S.results[i];
  } else if (kind === "retry"){
    S.retryResults = {};
    S.retryTries = {};
    S.retryDone = 0;
    S.retryTotal = 0;
  } else {
    S.fullResults = {};
  }
  delete S.doneLv[k];
  delete S.stars[k];
  delete S.levelStat[k];
  saveLevelProgress();
  enterLevel(k);
}

/* 点轨道上的关卡：已通关的进重刷，未通关的进开场 */
function jumpToLevel(k){
  if (k > unlockedLevel()) return;          // 还没解锁，必须按序来
  if (S.doneLv[k]) replayLevel(k);
  else enterLevel(k);
}

function startAnswer(){
  if (S.shell !== "play" || S.stage !== "study") return;
  S.mode = "answer";
  S.list = groupList(S.group);
  S.cur = 0;
  render();
}

function saveLevelProgress(){
  var s = setObj().set;
  var p = progress[s] || {};
  p.partial = true;
  p.levels = S.levelStat;
  p.results = S.results;
  p.firstScore = firstRight();
  p.total = itemArr().length;
  p.date = todayStr();
  progress[s] = p;
  saveProgress();
}

/* 本关结束：算成绩 → 记星 → 落盘 → 弹结算卡 */
function finishLevel(){
  var k = curLevel(), kind = levelKind(k);
  var right = levelRight(k), total = levelTotal(k);
  // 首轮全对时订正关一题都不用做 → 直接给满星
  var stars = (kind === "retry" && !total) ? 3 : levelStars(right, total);
  S.levelStat[k] = {
    right: right, total: total,
    secs: (nowMs() - S.levelStart) / 1000,
    streak: S.bestStreak,
    stars: stars, done: true
  };
  S.stars[k] = stars;
  S.doneLv[k] = true;
  saveLevelProgress();
  S.shell = "result";
}

function advanceGroup(){ finishLevel(); }

/* ==================== 流程：错题重刷 ==================== */
function startRetry(){
  S.stage = "retry";
  S.list = S.wrong.slice();
  S.retryTotal = S.list.length;
  S.retryDone = 0;
  S.retryResults = {};
  S.cur = 0;
  S.revealRetry = true;
}

function retryNext(){
  var itemIdx = S.list[S.cur];
  if (!itemIdx && itemIdx !== 0) return;
  var ok = S.retryResults[itemIdx] === itemArr()[itemIdx].answer;
  if (!ok) return;
  S.retryDone++;
  S.list.splice(S.cur, 1);
  if (S.list.length === 0){ finishLevel(); render(); return; }
  if (S.cur >= S.list.length) S.cur = 0;
  S.revealRetry = true;
  render();
}

function retryAgain(){
  var itemIdx = S.list[S.cur];
  delete S.retryResults[itemIdx];
  S.revealRetry = true;
  render();
}

/* ==================== 流程：整套重刷 ==================== */
function startFull(){
  S.stage = "full";
  S.list = itemArr().map(function(_, i){ return i; });
  S.fullResults = {};
  S.cur = 0;
  S.revealRetry = false;
}

function fullRight(){
  var n = 0, it = itemArr();
  for (var k in S.fullResults){
    if (S.fullResults[k] === it[k].answer) n++;
  }
  return n;
}

function firstRight(){
  var n = 0, it = itemArr();
  for (var i = 0; i < it.length; i++){
    if (S.results[i] === it[i].answer) n++;
  }
  return n;
}

function todayStr(){
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function finishFull(){
  var it = itemArr();
  var right = fullRight(), stars = levelStars(right, it.length);
  S.stage = "done";
  S.levelStat[S.group] = {
    right: right, total: it.length,
    secs: (nowMs() - S.levelStart) / 1000,
    streak: S.bestStreak,
    stars: stars, done: true
  };
  S.stars[S.group] = stars;
  S.doneLv[S.group] = true;
  progress[setObj().set] = {
    done: true,
    firstScore: firstRight(),
    fullScore: right,
    total: it.length,
    retryTotal: S.retryTotal,
    date: todayStr(),
    levels: S.levelStat,
    results: S.results
  };
  saveProgress();
  S.shell = "result";
}

/* ==================== 作答 ==================== */
function pick(key){
  if (S.view !== "quiz" && S.view !== "drill" && S.view !== "chapter") return;
  if (S.stage === "retry" && S.revealRetry) return;
  var itemIdx = S.list[S.cur];
  if (itemIdx === undefined) return;
  var box = resBox();
  if (box[itemIdx]) return;
  if (["A","B","C","D"].indexOf(key) < 0) return;
  box[itemIdx] = key;
  // 订正关记录尝试次数：只有「一次就答对」才算进本关成绩
  if (S.stage === "retry") S.retryTries[itemIdx] = (S.retryTries[itemIdx] || 0) + 1;
  if (key === itemArr()[itemIdx].answer){
    S.streak++;
    if (S.streak > S.bestStreak) S.bestStreak = S.streak;
  } else {
    S.streak = 0;
  }
  render();
}

function next(){
  if (S.view === "drill"){
    if (!S.drillResults[S.list[S.cur]]) return;
    if (S.cur < S.list.length - 1){ S.cur++; render(); }
    else finishDrill();
    return;
  }
  if (S.view !== "quiz") return;
  if (S.stage === "study"){
    if (S.mode !== "answer") return;
    if (!S.results[S.list[S.cur]]) return;
    if (S.cur < S.list.length - 1) S.cur++;
    else advanceGroup();
  } else if (S.stage === "full"){
    if (!S.fullResults[S.list[S.cur]]) return;
    if (S.cur < S.list.length - 1) S.cur++;
    else finishFull();
  }
  render();
}

function prev(){
  if (S.view === "drill"){
    if (S.cur > 0){ S.cur--; render(); }
    return;
  }
  if (S.view !== "quiz" || S.stage === "retry") return;
  if (S.cur > 0){ S.cur--; render(); }
}

/* ==================== 完成页 ==================== */
function renderDone(){
  var it = itemArr();
  var fr = firstRight(), sr = fullRight();
  var wrongs = [];
  for (var i = 0; i < it.length; i++){
    if (S.results[i] !== it[i].answer) wrongs.push(i);
  }
  var h = '<div class="done-hero"><div class="big">🎉</div>'
    + '<h2>第 ' + setObj().set + ' 套 · 已通关</h2>'
    + '<p>20 题首轮作答完毕，错题已全部订正，整套重刷已提交。</p></div>';

  h += '<div class="statgrid">'
    + '<div class="stat ok"><div class="v">' + sr + '/' + it.length + '</div><div class="l">整套重刷正确率 ' + pct(sr, it.length) + '%</div></div>'
    + '<div class="stat"><div class="v">' + fr + '/' + it.length + '</div><div class="l">首轮正确率 ' + pct(fr, it.length) + '%</div></div>'
    + '<div class="stat"><div class="v">' + S.retryTotal + '</div><div class="l">首轮错题数</div></div>'
    + '</div>';

  if (wrongs.length){
    h += '<div class="review"><h3>首轮错题回顾</h3>';
    wrongs.forEach(function(i){
      h += '<div class="rvitem"><b>第 ' + (i + 1) + ' 题</b> ' + it[i].stem
        + '<div style="margin-top:6px;font-size:14px;color:var(--sub)">你的选择：' + S.results[i]
        + '　正确答案：<b style="color:var(--ok)">' + it[i].answer + '</b></div>'
        + '<div class="exp" style="margin-top:8px"><span class="lab">解析</span><div class="txt">' + it[i].analysis + '</div></div>'
        + easyHtml(it[i]) + imgHtml(it[i]) + '</div>';
    });
    h += '</div>';
  }

  h += '<div class="certbox no-print"><h3 style="margin:0 0 12px;font-size:17px">生成通关证书</h3>'
    + '<div class="row"><input type="text" data-act="name" placeholder="请输入你的姓名" value="' + (S.name || "").replace(/"/g, "&quot;") + '">'
    + '<div class="seg">'
    + '<button data-act="cert-style" data-style="simple"' + (S.certStyle === "simple" ? ' class="on"' : "") + '>简约专业</button>'
    + '<button data-act="cert-style" data-style="gold"' + (S.certStyle === "gold" ? ' class="on"' : "") + '>红金喜庆</button>'
    + '</div>'
    + '<button class="primary" data-act="download-png">' + (inAndroidApp() ? "保存到相册" : "下载 PNG") + '</button>'
    + (inAndroidApp() ? '' : '<button data-act="print">打印 / 另存为 PDF</button>') + '</div>'
    + '<canvas id="certCanvas"></canvas>'
    + '<div class="note no-print">' + (inAndroidApp()
        ? '提示：输入姓名后证书会立即更新；点「保存到相册」即可把证书存进手机相册。'
        : '提示：输入姓名后证书会立即更新；「打印 / 另存为 PDF」在弹出的打印窗口中选择「另存为 PDF」即可。') + '</div>'
    + '<div class="btnrow no-print" style="margin-top:16px">'
    + '<button data-act="redo">重刷本套</button>'
    + '<button data-act="reset-set">清除本套记录</button>'
    + '<button data-act="home">返回首页</button></div>'
    + '</div>';
  return h;
}

/* ==================== 证书绘制 ==================== */
function drawCert(){
  var cv = document.getElementById("certCanvas");
  if (!cv || typeof cv.getContext !== "function") return;
  var g = null;
  try { g = cv.getContext("2d"); } catch (e) { return; }
  if (!g) return;

  var W = 1000, H = 700;
  cv.width = W; cv.height = H;
  var it = itemArr();
  var fr = firstRight(), sr = fullRight();
  var name = S.name || "＿＿＿＿＿＿";
  var isGold = (S.certStyle === "gold");
  var C = isGold
    ? { bg:"#fffdf6", frame:"#a8231d", frame2:"#c9a227", title:"#a8231d", ink:"#3a2c22", sub:"#8a7461", seal:"#b8912f", sealTxt:"#a8231d" }
    : { bg:"#ffffff", frame:"#2f5d9e", frame2:"#c8dbf5", title:"#1f3864", ink:"#28374a", sub:"#6b7a8d", seal:"#2f5d9e", sealTxt:"#2f5d9e" };
  var F = '"微软雅黑","Microsoft YaHei",sans-serif';

  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = C.frame; g.lineWidth = isGold ? 10 : 4;
  g.strokeRect(26, 26, W - 52, H - 52);
  g.strokeStyle = C.frame2; g.lineWidth = 2;
  g.strokeRect(48, 48, W - 96, H - 96);

  if (isGold){
    g.fillStyle = C.frame;
    [[48,48],[W-48,48],[48,H-48],[W-48,H-48]].forEach(function(p){
      g.beginPath(); g.arc(p[0], p[1], 9, 0, Math.PI * 2); g.fill();
    });
  }

  g.textAlign = "center";
  g.fillStyle = C.title;
  g.font = "bold 50px " + F;
  g.fillText("通 关 证 书", W / 2, 168);
  g.font = "16px " + F;
  g.fillStyle = C.sub;
  g.fillText("CERTIFICATE OF COMPLETION", W / 2, 200);

  g.strokeStyle = C.frame2; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(W / 2 - 150, 220); g.lineTo(W / 2 + 150, 220); g.stroke();

  g.fillStyle = C.sub; g.font = "20px " + F;
  g.fillText("兹 证 明", W / 2, 292);

  g.fillStyle = C.title; g.font = "bold 54px " + F;
  g.fillText(name, W / 2, 366);

  g.fillStyle = C.ink; g.font = "19px " + F;
  g.fillText("已完成《全国计算机等级考试选择题高分刷题》第 " + setObj().set + " 套全部 " + it.length + " 道题目", W / 2, 434);
  g.fillText("首轮正确率 " + pct(fr, it.length) + "%（" + fr + "/" + it.length + "）　整套重刷正确率 "
    + pct(sr, it.length) + "%（" + sr + "/" + it.length + "）", W / 2, 476);

  g.font = "17px " + F; g.fillStyle = C.sub;
  g.fillText("错题已全部订正，特发此证，以资鼓励。", W / 2, 524);

  // 印章
  g.beginPath(); g.arc(790, 578, 62, 0, Math.PI * 2);
  g.strokeStyle = C.seal; g.lineWidth = 4; g.stroke();
  g.beginPath(); g.arc(790, 578, 54, 0, Math.PI * 2);
  g.lineWidth = 1.5; g.stroke();
  g.fillStyle = C.sealTxt; g.font = "bold 22px " + F;
  g.fillText("刷题通关", 790, 572);
  g.font = "bold 15px " + F;
  g.fillText("认 证", 790, 598);

  g.textAlign = "left";
  g.fillStyle = C.ink; g.font = "18px " + F;
  g.fillText("全国计算机等级考试选择题高分刷题", 100, 588);
  g.font = "16px " + F; g.fillStyle = C.sub;
  g.fillText("日期：" + ((progress[setObj().set] && progress[setObj().set].date) || todayStr()), 100, 618);
}

/* 是否跑在安卓 App 的 WebView 里（原生桥由 MainActivity 注入）——
   是的话导出成绩单走相册、打印入口也藏起来（WebView 里打印没有意义） */
function inAndroidApp(){
  return !!(window.AndroidSave && typeof window.AndroidSave.png === "function");
}

function downloadPNG(){
  var cv = document.getElementById("certCanvas");
  if (!cv || typeof cv.toDataURL !== "function") return;
  var nm = (S.name || "学员").replace(/[\\/:*?"<>|]/g, "");
  var fileName = nm + "_第" + setObj().set + "套_通关证书.png";
  var dataUrl = cv.toDataURL("image/png");

  // 安卓 App：WebView 里 <a download> 不生效，交给原生代码存进相册
  if (inAndroidApp()){
    try{ window.AndroidSave.png(dataUrl, fileName); return; }catch(e){}
  }

  var a = document.createElement("a");
  a.href = dataUrl;
  a.download = fileName;
  if (document.body && document.body.appendChild) document.body.appendChild(a);
  if (typeof a.click === "function") a.click();
  if (document.body && document.body.removeChild) document.body.removeChild(a);
}

function printCert(){
  if (typeof window.print === "function"){ try{ window.print(); }catch(e){} }
}

/* ==================== 导航 ==================== */
function goHome(){ S.view = "home"; render(); }

function resetSet(){
  if (S.setIdx === null) return;
  delete progress[setObj().set];
  saveProgress();
  openSet(S.setIdx);
}

/* ==================== 渲染总入口 ==================== */
function updateTop(){
  var el = document.getElementById("topMeta");
  if (!el) return;
  if (S.view === "drill"){
    el.innerHTML = "第 <b>" + setObj().set + "</b> 套 · 直刷 " + drillCount() + "/" + itemArr().length + " 题";
  } else if (S.view === "drill-done"){
    el.innerHTML = "第 <b>" + setObj().set + "</b> 套 · 直刷完成 · 答对 " + drillRight() + "/" + itemArr().length;
  } else if (S.view === "home"){
    var tq = 0;
    SETS.forEach(function(s){ tq += s.items.length; });
    el.innerHTML = SETS.length + " 套 · " + tq + " 题";
  } else if (S.view === "chapters"){
    el.innerHTML = "知识点章节 · <b>" + CH.length + "</b> 章";
  } else if (S.view === "chapter" || S.view === "chapter-done"){
    var cc = chObj();
    var cr = cc ? cc.name : "";
    if (S.view === "chapter-done") el.innerHTML = cr + " · 已刷完 · 答对 " + chapterRight() + "/" + chItems().length;
    else el.innerHTML = "知识点章节 · " + cr + " · " + (S.cur + 1) + "/" + chItems().length;
  } else if (S.view === "quiz"){
    var k = curLevel();
    var lab = "第 " + (k + 1) + " 关 · " + levelName(k);
    var sub = "";
    if (S.shell === "play"){
      sub = S.stage === "study" ? (S.mode === "preview" ? " · 预览" : " · 作答")
        : (S.stage === "retry" ? " · 错题重刷" : " · 整套重刷");
    }
    el.innerHTML = "第 <b>" + setObj().set + "</b> 套 · " + lab + sub;
  } else {
    el.innerHTML = "第 <b>" + setObj().set + "</b> 套 · 已通关 · ★ " + starsTotal() + "/" + starsMax();
  }
}

/* 署名徽标只在首页出现；进入闯关 / 直刷 / 成绩页一律收起 */
function updateBadge(){
  var b = document.getElementById("authorBadge");
  if (!b || !b.classList) return;
  b.classList.toggle("hidden", S.view !== "home");
}

function render(){
  var app = document.getElementById("app");
  if (!app) return;
  if (S.view === "home") app.innerHTML = renderHome();
  else if (S.view === "quiz") app.innerHTML = renderQuiz();
  else if (S.view === "drill") app.innerHTML = renderDrill();
  else if (S.view === "drill-done") app.innerHTML = renderDrillDone();
  else if (S.view === "chapters") app.innerHTML = renderChapters();
  else if (S.view === "chapter") app.innerHTML = renderChapter();
  else if (S.view === "chapter-done") app.innerHTML = renderChapterDone();
  else app.innerHTML = renderDone();
  updateTop();
  updateBadge();
  if (S.view !== "home") hideLayoutTipSoft();   // 排版引导只在首页露面
  if (S.view === "done") drawCert();
  if (typeof window.scrollTo === "function"){ try{ window.scrollTo(0, 0); }catch (e) {} }
}

/* ==================== 事件 ==================== */
function handleAct(el){
  var act = el.getAttribute("data-act");
  if (!act) return;
  if (act === "open") openSet(parseInt(el.getAttribute("data-set"), 10));
  else if (act === "drill") openDrill(parseInt(el.getAttribute("data-set"), 10));
  else if (act === "drill-next") next();
  else if (act === "drill-prev") prev();
  else if (act === "drill-again") openDrill(S.setIdx);
  else if (act === "chapters") openChapters();
  else if (act === "chapter") openChapter(parseInt(el.getAttribute("data-ch"), 10));
  else if (act === "ch-next") chNext();
  else if (act === "ch-prev") chPrev();
  else if (act === "ch-again") openChapter(S.chapterIdx);
  else if (act === "start-answer") startAnswer();
  else if (act === "pick") pick(el.getAttribute("data-key"));
  else if (act === "next") next();
  else if (act === "prev") prev();
  else if (act === "retry-go"){ S.revealRetry = false; render(); }
  else if (act === "retry-next") retryNext();
  else if (act === "retry-again") retryAgain();
  else if (act === "home") goHome();
  else if (act === "onboard") showOnboard();
  else if (act === "layout") setLayout(el.getAttribute("data-mode"));
  else if (act === "tip-split"){ setLayout("split"); closeLayoutTip(); }
  else if (act === "tip-close") closeLayoutTip();
  else if (act === "reset-set") resetSet();
  else if (act === "redo") openSet(S.setIdx);
  else if (act === "cert-style"){ S.certStyle = el.getAttribute("data-style"); render(); }
  else if (act === "download-png") downloadPNG();
  else if (act === "print") printCert();
  else if (act === "level-start") beginLevel();
  else if (act === "level-next") nextLevel();
  else if (act === "level-replay") replayLevel();
  else if (act === "level-jump") jumpToLevel(parseInt(el.getAttribute("data-lv"), 10));
  else if (act === "zoomimg") openImgBox(el.getAttribute("data-src"));
  else if (act === "closeimg") closeImgBox();
}

/* 配图放大：图片元素自带 data-act="zoomimg" + data-src */
function openImgBox(src){
  var box = document.getElementById("imgbox");
  var img = document.getElementById("imgboxImg");
  if (!box || !img || !src) return;
  img.src = src;
  box.classList.add("on");
}
function closeImgBox(){
  var box = document.getElementById("imgbox");
  var img = document.getElementById("imgboxImg");
  if (!box) return;
  box.classList.remove("on");
  if (img) img.src = "";
}
function imgBoxOpen(){
  var box = document.getElementById("imgbox");
  return !!(box && box.classList && box.classList.contains("on"));
}

function bindEvents(){
  document.addEventListener("click", function(e){
    var el = e && e.target, found = null, ob = null, walk = el;
    // 新手引导用 data-od，和主流程的 data-act 分开，互不干扰
    while (walk && typeof walk.getAttribute === "function"){
      if (walk.getAttribute("data-od")){ ob = walk; break; }
      walk = walk.parentNode;
    }
    if (ob){ handleObAct(ob.getAttribute("data-od")); return; }
    while (el && typeof el.getAttribute === "function"){
      if (el.getAttribute("data-act")){ found = el; break; }
      el = el.parentNode;
    }
    if (found) handleAct(found);
    // 排版引导：点到气泡外（包括顶部的单列/两栏开关）就收起，且不再出现
    if (layoutTipOn()){
      var t = e && e.target;
      if (!(t && t.closest && t.closest("#layoutTip"))) closeLayoutTip();
    }
  });
  document.addEventListener("input", function(e){
    var t = e && e.target;
    if (t && typeof t.getAttribute === "function" && t.getAttribute("data-act") === "name"){
      S.name = t.value || "";
      drawCert();
    }
  });
  document.addEventListener("keydown", function(e){
    if (!e) return;
    // 新手引导打开时，方向键翻页、Enter 下一步、Esc 跳过，其它按键不再透到答题逻辑
    if (onboardOn()){
      if (e.key === "ArrowRight" || e.key === "Enter") onboardNext();
      else if (e.key === "ArrowLeft") onboardPrev();
      else if (e.key === "Escape") closeOnboard();
      return;
    }
    // 配图放大打开时，Esc 优先关闭它，且不让 ←/→/1-4 继续透到答题逻辑
    if (e.key === "Escape" && imgBoxOpen()){ closeImgBox(); return; }
    if (imgBoxOpen()) return;
    if (e.key === "Escape" && layoutTipOn()){ closeLayoutTip(); return; }
    if (S.view === "chapter"){
      if (e.key === "ArrowLeft") chPrev();
      else if (e.key === "ArrowRight") chNext();
      else if (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4"){
        pick(["A","B","C","D"][parseInt(e.key, 10) - 1]);
      }
      return;
    }
    if (S.view !== "quiz" && S.view !== "drill") return;
    if (S.view === "quiz" && S.stage === "study" && S.mode !== "answer") return;
    if (e.key === "ArrowLeft") prev();
    else if (e.key === "ArrowRight") next();
    else if (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4"){
      pick(["A","B","C","D"][parseInt(e.key, 10) - 1]);
    }
  });
  if (typeof window !== "undefined" && window.addEventListener){
    window.addEventListener("resize", function(){
      if (!layoutTipOn()) return;
      if (window.innerWidth <= 1080) closeLayoutTip();   // 窄屏开关已隐藏，收起引导
      else placeLayoutTip();                             // 重新贴到开关正下方
    });
  }
}

var booted = false;
function boot(){
  if (booted) return;
  booted = true;
  bindEvents();
  applyLayout();     // 恢复上次选的排版（首次进入默认单列）
  render();
  maybeShowOnboard();     // 第一次打开：先放一遍动画引导
  maybeShowLayoutTip();   // 排版气泡（引导看完会一并收起）
}

if (typeof document !== "undefined" && document.readyState && document.readyState !== "loading") boot();
if (typeof window !== "undefined"){
  window.onload = boot;
  if (window.addEventListener) window.addEventListener("DOMContentLoaded", boot);
}

window.__quiz = {
  state: S,
  SETS: SETS,
  render: render,
  boot: boot,
  handleAct: handleAct,
  openSet: openSet,
  openDrill: openDrill,
  renderDrill: renderDrill,
  renderDrillDone: renderDrillDone,
  finishDrill: finishDrill,
  drillRight: drillRight,
  drillCount: drillCount,
  updateBadge: updateBadge,
  showOnboard: showOnboard,
  closeOnboard: closeOnboard,
  maybeShowOnboard: maybeShowOnboard,
  onboardNext: onboardNext,
  onboardPrev: onboardPrev,
  onboardOn: onboardOn,
  onboardStep: onboardStep,
  onboardTotal: onboardTotal,
  onboardDone: onboardDone,
  obArt: obArt,
  startAnswer: startAnswer,
  pick: pick,
  next: next,
  prev: prev,
  retryNext: retryNext,
  retryAgain: retryAgain,
  startFull: startFull,
  finishFull: finishFull,
  resetSet: resetSet,
  drawCert: drawCert,
  maskHtml: maskHtml,
  easyHtml: easyHtml,
  imgHtml: imgHtml,
  splitHtml: splitHtml,
  openImgBox: openImgBox,
  closeImgBox: closeImgBox,
  imgBoxOpen: imgBoxOpen,
  groupCount: groupCount,
  retryLevel: retryLevel,
  fullLevel: fullLevel,
  levelCount: levelCount,
  levelKind: levelKind,
  levelShort: levelShort,
  levelName: levelName,
  levelStars: levelStars,
  levelRight: levelRight,
  levelTotal: levelTotal,
  retryFirstTry: retryFirstTry,
  unlockedLevel: unlockedLevel,
  starsTotal: starsTotal,
  starsMax: starsMax,
  trackHtml: trackHtml,
  beginLevel: beginLevel,
  nextLevel: nextLevel,
  replayLevel: replayLevel,
  jumpToLevel: jumpToLevel,
  finishLevel: finishLevel,
  downloadPNG: downloadPNG,
  layout: function(){ return S.layout; },
  /* 知识点章节 */
  CH: CH,
  chObj: chObj,
  chItems: chItems,
  openChapters: openChapters,
  openChapter: openChapter,
  renderChapters: renderChapters,
  renderChapter: renderChapter,
  renderChapterDone: renderChapterDone,
  chNext: chNext,
  chPrev: chPrev,
  finishChapter: finishChapter,
  chapterRight: chapterRight,
  chapterSecs: chapterSecs,
  quizItemHtml: quizItemHtml,
  setLayout: setLayout,
  applyLayout: applyLayout,
  loadLayout: loadLayout,
  layoutTipDone: layoutTipDone,
  layoutTipOn: layoutTipOn,
  showLayoutTip: showLayoutTip,
  closeLayoutTip: closeLayoutTip,
  maybeShowLayoutTip: maybeShowLayoutTip,
  inAndroidApp: inAndroidApp,
  isPhoneWidth: isPhoneWidth,
  progress: function(){ return progress; }
};
})();
</script>
